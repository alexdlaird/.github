name: 'Prepare Release'
description: 'Parse CHANGELOG.md, compute the next version, rewrite the changelog, and extract release notes.'

inputs:
  bump-type:
    description: 'Semver bump type: patch, minor, or major'
    required: true
  repo-slug:
    description: 'GitHub repo slug (e.g. "alexdlaird/pyngrok")'
    required: true

outputs:
  new-version:
    description: 'Computed new version string'
    value: ${{ steps.compute.outputs.new_version }}
  old-version:
    description: 'Previous released version string'
    value: ${{ steps.compute.outputs.old_version }}
  release-notes:
    description: 'Changelog content for the new version (for GitHub release body)'
    value: ${{ steps.compute.outputs.release_notes }}

runs:
  using: 'composite'
  steps:
    - name: Validate and compute version
      id: compute
      shell: bash
      env:
        BUMP_TYPE: ${{ inputs.bump-type }}
        REPO_SLUG: ${{ inputs.repo-slug }}
      run: |
        set -euo pipefail

        # --- Validate CHANGELOG structure ---
        if [ ! -f CHANGELOG.md ]; then
          echo "::error::CHANGELOG.md not found"
          exit 1
        fi

        UNRELEASED_LINE=$(grep -nm 1 '^## \[Unreleased\]' CHANGELOG.md || true)
        if [ -z "$UNRELEASED_LINE" ]; then
          echo "::error::No '## [Unreleased]' section found in CHANGELOG.md"
          exit 1
        fi
        UNRELEASED_LINENO=$(echo "$UNRELEASED_LINE" | cut -d: -f1)

        PREV_VERSION_LINE=$(awk -v n="$UNRELEASED_LINENO" 'NR > n && /^## \[[0-9]/ {print; exit}' CHANGELOG.md)
        if [ -z "$PREV_VERSION_LINE" ]; then
          echo "::error::No previous version entry found in CHANGELOG.md"
          exit 1
        fi
        PREV_VERSION_LINENO=$(grep -nFm 1 "$PREV_VERSION_LINE" CHANGELOG.md | cut -d: -f1)

        # Extract content between Unreleased header and previous version header
        CONTENT=$(sed -n "$((UNRELEASED_LINENO + 1)),$((PREV_VERSION_LINENO - 1))p" CHANGELOG.md)
        TRIMMED=$(echo "$CONTENT" | sed '/^[[:space:]]*$/d')

        if [ -z "$TRIMMED" ]; then
          echo "::error::No content found under [Unreleased] section. Add changelog entries before releasing."
          exit 1
        fi

        # Fail if content looks like it already has a version/date header (old workflow pattern)
        if echo "$CONTENT" | grep -qE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]'; then
          echo "::error::Found a version header under [Unreleased]. Use the new workflow: put entries directly under [Unreleased] without a version/date header."
          exit 1
        fi

        # Fail if changelog contains breaking changes but bump type is not major
        if echo "$CONTENT" | grep -q '^### Breaking'; then
          if [ "$BUMP_TYPE" != "major" ]; then
            echo "::error::Changelog contains a '### Breaking' section, but bump type is '${BUMP_TYPE}'. Use 'major' for breaking changes."
            exit 1
          fi
        fi

        # --- Parse previous version ---
        OLD_VERSION=$(echo "$PREV_VERSION_LINE" | sed -n 's/^## \[\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\].*/\1/p')
        if [ -z "$OLD_VERSION" ]; then
          echo "::error::Could not parse previous version from: $PREV_VERSION_LINE"
          exit 1
        fi

        IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"

        # --- Compute new version ---
        case "$BUMP_TYPE" in
          major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
          minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
          patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          *)
            echo "::error::Invalid bump type: $BUMP_TYPE"
            exit 1
            ;;
        esac

        TODAY=$(date -u +%Y-%m-%d)

        echo "Previous version: ${OLD_VERSION}"
        echo "New version: ${NEW_VERSION} (${BUMP_TYPE} bump)"
        echo "Release date: ${TODAY}"

        # --- Rewrite CHANGELOG ---
        NEW_UNRELEASED="## [Unreleased](https://github.com/${REPO_SLUG}/compare/${NEW_VERSION}...HEAD)"
        NEW_VERSION_HEADER="## [${NEW_VERSION}](https://github.com/${REPO_SLUG}/compare/${OLD_VERSION}...${NEW_VERSION}) - ${TODAY}"

        # Build the new file:
        #   1. Everything up to and including the Unreleased line (replaced)
        #   2. Blank line
        #   3. New version header
        #   4. The unreleased content (moved under the new version header)
        #   5. Everything from the previous version header onward (unchanged)
        {
          head -n $((UNRELEASED_LINENO - 1)) CHANGELOG.md
          echo "$NEW_UNRELEASED"
          echo ""
          echo "$NEW_VERSION_HEADER"
          echo "$CONTENT"
          echo ""
          tail -n "+${PREV_VERSION_LINENO}" CHANGELOG.md
        } > CHANGELOG.md.tmp
        mv CHANGELOG.md.tmp CHANGELOG.md

        # --- Extract release notes (trim leading/trailing blank lines) ---
        RELEASE_NOTES=$(echo "$CONTENT" | awk 'NF{found=1} found' | tac | awk 'NF{found=1} found' | tac)

        echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
        echo "old_version=${OLD_VERSION}" >> $GITHUB_OUTPUT

        # Use a delimiter for multiline output
        EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
        echo "release_notes<<${EOF_MARKER}" >> $GITHUB_OUTPUT
        echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
        echo "${EOF_MARKER}" >> $GITHUB_OUTPUT
