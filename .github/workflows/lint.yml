name: Lint

run-name: Lint ${{ github.ref_name }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Through the API with the job's token: anonymous release downloads from runners can come back as an error page.
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: 1.7.12
        run: |
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          gh release download "v${ACTIONLINT_VERSION}" --repo rhysd/actionlint --pattern "$ARCHIVE" --pattern "$CHECKSUMS"
          grep " ${ARCHIVE}\$" "$CHECKSUMS" | sha256sum --check -
          tar -xzf "$ARCHIVE" actionlint

      - name: Lint workflows
        run: ./actionlint -color
