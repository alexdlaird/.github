name: Store Submit (Submit a release's candidates for review)

# Submits the builds CI uploaded for a released commit: the TestFlight build for App Store review and the Internal-track
# version code for Play Production review, by the numbers in that CI run's `ios-build` / `android-build` artifacts. With
# `submit_for_review: false` it stages them instead (the App Store version with its build attached, a Play Production
# draft), to be sent for review from the consoles.
# With `replace_pending_review`, a submission still waiting for review is replaced (it loses its place in the queue): on
# the App Store only one Waiting for Review, never one In Review; on Play one in review or approved but unpublished.
# The app supplies the `fastlane` lanes `submit_appstore` (version:, build_number:, push_store_assets:,
# submit_for_review:, replace_pending_review:) and `submit_production` (version:, version_code:, push_store_assets:,
# submit_for_review:, replace_pending_review:; re-staging from Play's library if Internal moved on).
on:
  workflow_call:
    inputs:
      app_name:
        description: "Short app name; names the TestFlight and Google Play concurrency groups (shared with the candidate builds)"
        required: true
        type: string
      version:
        description: "The released version, as the lanes take it"
        required: true
        type: string
      ref:
        description: "The released commit"
        required: true
        type: string
      build_run_id:
        description: "The CI run that built the release candidates"
        required: true
        type: string
      push_store_assets:
        description: "Also replace store screenshots and listing assets"
        required: false
        type: boolean
        default: false
      submit_for_review:
        description: "Send the builds for review; false stages them for sending from the consoles"
        required: false
        type: boolean
        default: true
      replace_pending_review:
        description: "When submitting, replace a submission still waiting for review (it loses its place in the queue)"
        required: false
        type: boolean
        default: true
      ios_console_url:
        description: "App Store Connect link for the run summary"
        required: false
        type: string
        default: ''
      android_console_url:
        description: "Play Console link for the run summary"
        required: false
        type: string
        default: ''
      ios:
        description: "Submit to the App Store"
        required: false
        type: boolean
        default: true
      android:
        description: "Submit to Google Play"
        required: false
        type: boolean
        default: true
      ios_runs_on:
        description: "JSON runner labels for the App Store submission (the Mac that holds the iOS deploy lock)"
        required: false
        type: string
        default: '["self-hosted", "macos", "arm64"]'
      android_runs_on:
        description: "JSON runner labels for the Play submission"
        required: false
        type: string
        default: '"ubuntu-latest"'
      app_review_first_name:
        description: "App Review contact"
        required: false
        type: string
        default: ''
      app_review_last_name:
        description: "App Review contact"
        required: false
        type: string
        default: ''
      app_review_email:
        description: "App Review contact"
        required: false
        type: string
        default: ''
    secrets:
      app_store_connect_api_key_id:
        required: false
      app_store_connect_api_issuer_id:
        required: false
      app_store_connect_api_key:
        required: false
      app_review_phone:
        required: false
      apple_id:
        description: "APPLE_ID for an Appfile that reads it"
        required: false
      app_store_connect_team_id:
        description: "APP_STORE_CONNECT_TEAM_ID for an Appfile that reads it"
        required: false
      google_play_service_account_key:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  # Only `fastlane` runs, but on the Mac: it shares ~/.appstoreconnect with every iOS deploy there, so it takes the same
  # lock.
  ios:
    if: inputs.ios
    runs-on: ${{ fromJSON(inputs.ios_runs_on) }}
    timeout-minutes: 90
    concurrency:
      group: ${{ inputs.app_name }}-testflight
      cancel-in-progress: false

    steps:
      - name: Wait for the Mac's iOS deploy lock
        uses: alexdlaird/shipshape/ios-deploy-lock@v1
        with:
          mode: acquire

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Homebrew path
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Download the release's build number
        uses: actions/download-artifact@v8
        with:
          name: ios-build
          path: build/release-candidate
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Ensure tool cache directory is writable
        run: |
          # A CI user shares a group-writable cache (dev-init-mac-runner); only an owner-run runner needs sudo.
          if [ ! -w /Users/runner/hostedtoolcache ]; then
            sudo mkdir -p /Users/runner/hostedtoolcache
            sudo chown "$USER":staff /Users/runner/hostedtoolcache
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: 'Gemfile.lock'
          bundler-cache: true
          working-directory: ios

      - name: Install Fastlane
        run: cd ios && bundle install

      - name: ${{ inputs.submit_for_review && 'Submit for App Store review' || 'Stage App Store version' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.app_store_connect_api_key_id }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.app_store_connect_api_issuer_id }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.app_store_connect_api_key }}
          APPLE_ID: ${{ secrets.apple_id }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.app_store_connect_team_id }}
          APP_REVIEW_FIRST_NAME: ${{ inputs.app_review_first_name }}
          APP_REVIEW_LAST_NAME: ${{ inputs.app_review_last_name }}
          APP_REVIEW_EMAIL: ${{ inputs.app_review_email }}
          APP_REVIEW_PHONE: ${{ secrets.app_review_phone }}
          VERSION: ${{ inputs.version }}
          PUSH_STORE_ASSETS: ${{ inputs.push_store_assets }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
          REPLACE_PENDING_REVIEW: ${{ inputs.replace_pending_review }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_"${APP_STORE_CONNECT_API_KEY_ID}".p8
          BUILD_NUMBER=$(cat build/release-candidate/build_number.txt)
          cd ios && bundle exec fastlane submit_appstore \
            version:"$VERSION" build_number:"$BUILD_NUMBER" push_store_assets:"$PUSH_STORE_ASSETS" \
            submit_for_review:"$SUBMIT_FOR_REVIEW" replace_pending_review:"$REPLACE_PENDING_REVIEW"

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
          CONSOLE_URL: ${{ inputs.ios_console_url }}
        run: |
          if [ "$SUBMIT_FOR_REVIEW" = "true" ]; then
            STATUS="Submitted for review."
          else
            STATUS="Staged. Click **Submit for Review** in App Store Connect when ready."
          fi
          {
            echo "### App Store"
            echo ""
            echo "- **Version**: ${VERSION}+$(cat build/release-candidate/build_number.txt)"
            echo "- **Status**: ${STATUS}"
            if [ -n "$CONSOLE_URL" ]; then echo "- **Console**: [App Store Connect](${CONSOLE_URL})"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -rf ~/.appstoreconnect

      - name: Release the Mac's iOS deploy lock
        if: always()
        uses: alexdlaird/shipshape/ios-deploy-lock@v1
        with:
          mode: release

  android:
    if: inputs.android
    runs-on: ${{ fromJSON(inputs.android_runs_on) }}
    timeout-minutes: 20
    concurrency:
      group: ${{ inputs.app_name }}-google-play
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Download the release's version code
        uses: actions/download-artifact@v8
        with:
          name: android-build
          path: build/release-candidate
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: 'Gemfile.lock'
          bundler-cache: true
          working-directory: android

      - name: Install Fastlane
        run: cd android && bundle install

      - name: Write Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.google_play_service_account_key }}
        run: echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" > android/service-account-key.json

      - name: ${{ inputs.submit_for_review && 'Submit for Production review' || 'Stage Production draft' }}
        env:
          VERSION: ${{ inputs.version }}
          PUSH_STORE_ASSETS: ${{ inputs.push_store_assets }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
          REPLACE_PENDING_REVIEW: ${{ inputs.replace_pending_review }}
        run: |
          VERSION_CODE=$(cat build/release-candidate/version_code.txt)
          cd android && bundle exec fastlane submit_production \
            version:"$VERSION" version_code:"$VERSION_CODE" push_store_assets:"$PUSH_STORE_ASSETS" \
            submit_for_review:"$SUBMIT_FOR_REVIEW" replace_pending_review:"$REPLACE_PENDING_REVIEW"

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
          CONSOLE_URL: ${{ inputs.android_console_url }}
        run: |
          if [ "$SUBMIT_FOR_REVIEW" = "true" ]; then
            STATUS="Submitted for review."
          else
            STATUS="Staged as a draft. Click **Send for review** in Play Console when ready."
          fi
          {
            echo "### Google Play"
            echo ""
            echo "- **Version**: ${VERSION}+$(cat build/release-candidate/version_code.txt)"
            echo "- **Track**: Production"
            echo "- **Status**: ${STATUS}"
            if [ -n "$CONSOLE_URL" ]; then echo "- **Console**: [Google Play Console](${CONSOLE_URL})"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f android/service-account-key.json
