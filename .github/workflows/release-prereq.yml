name: Release Pre-req (Squash develop into main)

on:
  workflow_call:
    inputs:
      version_file:
        description: "Path to the file containing the version"
        required: true
        type: string
      version_pattern:
        description: 'sed expression that writes the version; ${VERSION} is substituted before invocation'
        required: true
        type: string
      version_parts:
        description: "3 for X.Y.Z; 2 for X.Y (the file holds X.Y.0)"
        required: false
        type: number
        default: 3
      changelog:
        description: "The repo keeps a CHANGELOG.md whose [Unreleased] entries the release dates. It is then the one file main may differ in from the tested commit."
        required: false
        type: boolean
        default: false
      ci_workflow:
        description: "The workflow that tests and builds every push to develop"
        required: false
        type: string
        default: build.yml
      repo_slug:
        description: "owner/repo"
        required: true
        type: string
    secrets:
      bot_app_id:
        required: true
      bot_private_key:
        required: true
    outputs:
      version:
        description: "The released version (develop's)"
        value: ${{ jobs.prereq.outputs.version }}
      squash_commit_sha:
        description: "SHA of the new squash commit on main"
        value: ${{ jobs.prereq.outputs.squash_commit_sha }}
      squash_boundary_sha:
        description: "The develop SHA that was squashed into main"
        value: ${{ jobs.prereq.outputs.squash_boundary_sha }}
      build_run_id:
        description: "The ci_workflow push run that tested the squashed SHA; its artifacts are the release's"
        value: ${{ jobs.prereq.outputs.build_run_id }}
      release_notes:
        description: "The CHANGELOG section for the version, or the squashed commit subjects"
        value: ${{ jobs.prereq.outputs.release_notes }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}

jobs:
  prereq:
    name: Squash develop into main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
      squash_commit_sha: ${{ steps.push.outputs.commit }}
      squash_boundary_sha: ${{ steps.boundary.outputs.sha }}
      build_run_id: ${{ steps.wait-for-build.outputs.run-id }}
      release_notes: ${{ steps.prepare.outputs.release-notes }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.bot_app_id }}
          private-key: ${{ secrets.bot_private_key }}
          skip-token-revoke: true

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: main

      - name: Get bot user ID
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.bot-user.outputs.user-id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Fetch develop
        run: git fetch origin develop

      - name: Pre-validate main is merged into develop
        run: |
          # A release that stopped after pushing main (cancelled, or its cleanup failed) leaves main with commits
          # develop doesn't have; squashing on top of them loses that release.
          if ! git merge-base --is-ancestor main origin/develop; then
            LAST=$(git log -1 --format='%h %s' main)
            echo "::error::main has commits develop doesn't (last: ${LAST}). Merge main into develop first (keep develop's code and main's changelog), tag main's release commit if it has no tag, then re-run."
            exit 1
          fi

      - name: Record squash boundary
        id: boundary
        run: echo "sha=$(git rev-parse origin/develop)" >> "$GITHUB_OUTPUT"

      - name: Pre-validate develop ahead of main
        run: |
          AHEAD=$(git rev-list --count main..origin/develop)
          if [ "$AHEAD" -eq 0 ]; then
            echo "::error::develop has no new commits over main; nothing to release."
            exit 1
          fi
          echo "develop is ${AHEAD} commits ahead of main"

      - name: Read release version
        id: read-version
        uses: alexdlaird/shipshape/read-version@v1
        with:
          version-file: ${{ inputs.version_file }}
          version-pattern: ${{ inputs.version_pattern }}
          version-parts: ${{ inputs.version_parts }}
          ref: ${{ steps.boundary.outputs.sha }}

      - name: Pre-validate version is unreleased
        uses: alexdlaird/shipshape/check-unreleased@v1
        with:
          version: ${{ steps.read-version.outputs.version }}

      - name: Squash develop into main
        env:
          SQUASH_BOUNDARY: ${{ steps.boundary.outputs.sha }}
        run: git merge --squash "$SQUASH_BOUNDARY"

      - name: Prepare release notes (and CHANGELOG)
        id: prepare
        uses: alexdlaird/shipshape/prepare-release@v1
        with:
          changelog: ${{ inputs.changelog }}
          version: ${{ steps.read-version.outputs.version }}
          version-parts: ${{ inputs.version_parts }}
          repo-slug: ${{ inputs.repo_slug }}
          tested-sha: ${{ steps.boundary.outputs.sha }}

      - name: Run repo validation
        env:
          VERSION: ${{ steps.read-version.outputs.version }}
        run: |
          if make -n validate-release VERSION="${VERSION}" >/dev/null 2>&1; then
            make validate-release VERSION="${VERSION}"
          fi

      - name: Verify main gets develop's tested code
        uses: alexdlaird/shipshape/verify-tree@v1
        with:
          tested-sha: ${{ steps.boundary.outputs.sha }}
          changelog: ${{ inputs.changelog }}

      - name: Wait for the develop push run to succeed
        id: wait-for-build
        uses: alexdlaird/shipshape/wait-for-ci@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sha: ${{ steps.boundary.outputs.sha }}
          repo-slug: ${{ inputs.repo_slug }}
          workflow: ${{ inputs.ci_workflow }}

      - name: Commit squash to main (signed, keeping file modes)
        id: push
        uses: IAreKyleW00t/verified-bot-commit@v2.3.5
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ inputs.repo_slug }}
          ref: main
          files: '**'
          if-no-commit: error
          message: |
            Release ${{ steps.read-version.outputs.version }}

            ${{ steps.prepare.outputs.release-notes }}

      - name: Verify main is the tested code
        uses: alexdlaird/shipshape/verify-tree@v1
        with:
          tested-sha: ${{ steps.boundary.outputs.sha }}
          commit: ${{ steps.push.outputs.commit }}
          changelog: ${{ inputs.changelog }}

      - name: Add release to job summary
        env:
          VERSION: ${{ steps.read-version.outputs.version }}
          SHA: ${{ steps.push.outputs.commit }}
          REPO_SLUG: ${{ inputs.repo_slug }}
        run: |
          {
            echo "## Release \`${VERSION}\`"
            echo ""
            echo "Squash commit: [\`${SHA:0:7}\`](https://github.com/${REPO_SLUG}/commit/${SHA})"
          } >> "$GITHUB_STEP_SUMMARY"
