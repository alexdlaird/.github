name: Release Pre-req (Squash develop into main)

on:
  workflow_call:
    inputs:
      bump_type:
        description: "patch | minor | major"
        required: true
        type: string
      version_file:
        description: "Path to the file containing the version"
        required: true
        type: string
      version_pattern:
        description: 'sed expression; ${VERSION} will be substituted before invocation'
        required: true
        type: string
      repo_slug:
        description: "owner/repo"
        required: true
        type: string
      additional_bump_files:
        description: "Newline-separated list of files where pinned references '==OLD_VERSION' should be rewritten to '==NEW_VERSION'."
        required: false
        type: string
        default: ''
    secrets:
      bot_app_id:
        required: true
      bot_private_key:
        required: true
    outputs:
      version:
        description: "Resolved new version"
        value: ${{ jobs.prereq.outputs.version }}
      squash_commit_sha:
        description: "SHA of new squash commit on main"
        value: ${{ jobs.prereq.outputs.squash_commit_sha }}
      release_notes:
        description: "CHANGELOG body for the new version"
        value: ${{ jobs.prereq.outputs.release_notes }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prereq:
    name: Squash develop into main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.new-version }}
      squash_commit_sha: ${{ steps.push.outputs.sha }}
      release_notes: ${{ steps.compute.outputs.release-notes }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.bot_app_id }}
          private-key: ${{ secrets.bot_private_key }}
          skip-token-revoke: true

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: main

      - name: Get bot user ID
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.bot-user.outputs.user-id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Fetch develop
        run: git fetch origin develop

      - name: Record squash boundary
        id: boundary
        run: echo "sha=$(git rev-parse origin/develop)" >> "$GITHUB_OUTPUT"

      - name: Pre-validate develop ahead of main
        run: |
          AHEAD=$(git rev-list --count main..origin/develop)
          if [ "$AHEAD" -eq 0 ]; then
            echo "::error::develop has no new commits over main — nothing to release."
            exit 1
          fi
          echo "develop is $AHEAD commits ahead of main"

      - name: Squash develop into main
        run: git merge --squash origin/develop

      - name: Compute version + rewrite CHANGELOG
        id: compute
        uses: alexdlaird/.github/actions/prepare-release@main
        with:
          bump-type: ${{ inputs.bump_type }}
          repo-slug: ${{ inputs.repo_slug }}

      - name: Pre-validate tag does not already exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_VERSION: ${{ steps.compute.outputs.new-version }}
          REPO_SLUG: ${{ inputs.repo_slug }}
        run: |
          if gh api "repos/${REPO_SLUG}/git/refs/tags/${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${NEW_VERSION} already exists."
            exit 1
          fi

      - name: Bump version in source file
        env:
          VERSION: ${{ steps.compute.outputs.new-version }}
          VERSION_FILE: ${{ inputs.version_file }}
          VERSION_PATTERN: ${{ inputs.version_pattern }}
        run: |
          PATTERN="${VERSION_PATTERN//\$\{VERSION\}/${VERSION}}"
          sed -i "${PATTERN}" "${VERSION_FILE}"
          grep -F "${VERSION}" "${VERSION_FILE}" >/dev/null \
            || { echo "::error::Version bump failed in ${VERSION_FILE}"; exit 1; }

      - name: Bump pinned versions in additional files
        if: inputs.additional_bump_files != ''
        env:
          OLD_VERSION: ${{ steps.compute.outputs.old-version }}
          NEW_VERSION: ${{ steps.compute.outputs.new-version }}
          FILES: ${{ inputs.additional_bump_files }}
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            sed -i "s/==${OLD_VERSION}/==${NEW_VERSION}/g" "$f"
            grep -qF "==${NEW_VERSION}" "$f" || { echo "::error::Pin bump failed in ${f}"; exit 1; }
          done <<< "$FILES"

      - name: Run repo validation
        env:
          VERSION: ${{ steps.compute.outputs.new-version }}
        run: make validate-release VERSION="${VERSION}"

      - name: Wait for build.yml on develop HEAD to succeed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEVELOP_SHA: ${{ steps.boundary.outputs.sha }}
          REPO_SLUG: ${{ inputs.repo_slug }}
          CI_TIMEOUT_MINUTES: 20
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + CI_TIMEOUT_MINUTES * 60 ))
          POLL_INTERVAL=30

          # Guard: develop must not have moved since boundary was recorded
          CURRENT=$(gh api "repos/${REPO_SLUG}/git/refs/heads/develop" --jq .object.sha)
          if [ "$CURRENT" != "$DEVELOP_SHA" ]; then
            echo "::error::develop HEAD moved during release (was ${DEVELOP_SHA}, now ${CURRENT}). Abort and re-dispatch."
            exit 1
          fi

          latest_run() {
            gh api "repos/${REPO_SLUG}/actions/workflows/build.yml/runs?head_sha=${DEVELOP_SHA}" \
              --jq '.workflow_runs | max_by(.id) // empty'
          }

          LATEST=$(latest_run)
          if [ -z "$LATEST" ]; then
            RUN_ID=""; RUN_STATUS=""; RUN_CONCLUSION=""
          else
            RUN_ID=$(jq -r '.id' <<< "$LATEST")
            RUN_STATUS=$(jq -r '.status' <<< "$LATEST")
            RUN_CONCLUSION=$(jq -r '.conclusion // ""' <<< "$LATEST")
          fi

          TRIGGER_FRESH=false
          if [ -z "$RUN_ID" ]; then
            echo "No build.yml run for ${DEVELOP_SHA}; triggering fresh dispatch"
            TRIGGER_FRESH=true
          elif [ "$RUN_STATUS" = "completed" ] && [ "$RUN_CONCLUSION" != "success" ]; then
            echo "Latest build.yml run ${RUN_ID} concluded '${RUN_CONCLUSION}'; triggering fresh dispatch"
            TRIGGER_FRESH=true
          else
            echo "Tracking existing build.yml run ${RUN_ID} (status=${RUN_STATUS})"
          fi

          if [ "$TRIGGER_FRESH" = "true" ]; then
            PRIOR_ID="${RUN_ID:-0}"
            gh workflow run build.yml --ref develop --repo "${REPO_SLUG}"
            for _ in $(seq 1 12); do
              sleep 5
              NEXT=$(latest_run)
              [ -z "$NEXT" ] && continue
              NEXT_ID=$(jq -r '.id' <<< "$NEXT")
              if [ "$NEXT_ID" != "$PRIOR_ID" ]; then
                RUN_ID=$NEXT_ID
                echo "Fresh build.yml run registered: ${RUN_ID}"
                break
              fi
            done
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "$PRIOR_ID" ]; then
              echo "::error::Fresh build.yml dispatch did not register a new run for ${DEVELOP_SHA} within 60s"
              exit 1
            fi
          fi

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RUN=$(gh api "repos/${REPO_SLUG}/actions/runs/${RUN_ID}")
            STATUS=$(jq -r '.status' <<< "$RUN")
            REMAINING=$(( DEADLINE - $(date +%s) ))
            if [ "$STATUS" = "completed" ]; then
              CONCLUSION=$(jq -r '.conclusion // ""' <<< "$RUN")
              if [ "$CONCLUSION" = "success" ]; then
                echo "build.yml run ${RUN_ID} succeeded on develop HEAD"
                exit 0
              fi
              echo "::error::build.yml run ${RUN_ID} concluded '${CONCLUSION}'"
              exit 1
            fi
            echo "build.yml run ${RUN_ID} status=${STATUS} (${REMAINING}s remaining)"
            sleep $POLL_INTERVAL
          done

          echo "::error::Timed out waiting for build.yml run ${RUN_ID} after ${CI_TIMEOUT_MINUTES} minutes"
          exit 1

      - name: Commit squash to main (signed via createCommitOnBranch)
        id: push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_VERSION: ${{ steps.compute.outputs.new-version }}
          RELEASE_NOTES: ${{ steps.compute.outputs.release-notes }}
          REPO_SLUG: ${{ inputs.repo_slug }}
        run: |
          set -euo pipefail

          # Materialize working-tree mutations into the index so diff captures everything.
          git add -A

          # expectedHeadOid is local main HEAD — same SHA the runner checked out at job start.
          # If origin/main moved since, GraphQL rejects with mismatch (concurrency guard).
          EXPECTED_HEAD=$(git rev-parse HEAD)

          # Accumulate additions/deletions on disk rather than in shell variables so neither
          # a single file's base64 nor the aggregated payload can exceed MAX_ARG_STRLEN
          # (~128 KiB per argv string on Linux) when invoking jq or gh.
          ADD_FILE=$(mktemp); echo '[]' > "$ADD_FILE"
          DEL_FILE=$(mktemp); echo '[]' > "$DEL_FILE"
          NOTES_FILE=$(mktemp); printf '%s' "$RELEASE_NOTES" > "$NOTES_FILE"
          PAYLOAD_FILE=$(mktemp)
          trap 'rm -f "$ADD_FILE" "$DEL_FILE" "$NOTES_FILE" "$PAYLOAD_FILE"' EXIT

          append_addition() {
            local path="$1"
            local b64_file tmp
            b64_file=$(mktemp)
            base64 -w 0 < "$path" > "$b64_file"
            tmp=$(mktemp)
            jq --arg p "$path" --rawfile c "$b64_file" \
               '. + [{path: $p, contents: $c}]' "$ADD_FILE" > "$tmp"
            mv "$tmp" "$ADD_FILE"
            rm -f "$b64_file"
          }

          append_deletion() {
            local path="$1"
            local tmp
            tmp=$(mktemp)
            jq --arg p "$path" '. + [{path: $p}]' "$DEL_FILE" > "$tmp"
            mv "$tmp" "$DEL_FILE"
          }

          while IFS=$'\t' read -r STATUS_RAW PATH_A PATH_B; do
            [ -z "${STATUS_RAW:-}" ] && continue
            STATUS="${STATUS_RAW:0:1}"
            case "$STATUS" in
              A|M|T|C) append_addition "$PATH_A" ;;
              R)       append_deletion "$PATH_A"; append_addition "$PATH_B" ;;
              D)       append_deletion "$PATH_A" ;;
              *)       echo "::warning::Unknown diff status '${STATUS_RAW}' for ${PATH_A}" ;;
            esac
          done < <(git diff --name-status --cached "${EXPECTED_HEAD}")

          A_COUNT=$(jq 'length' "$ADD_FILE")
          D_COUNT=$(jq 'length' "$DEL_FILE")
          if [ "$A_COUNT" -eq 0 ] && [ "$D_COUNT" -eq 0 ]; then
            echo "::error::No file changes between local working tree and main HEAD; nothing to commit."
            exit 1
          fi
          echo "Committing ${A_COUNT} additions / ${D_COUNT} deletions to main"

          QUERY='mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }'

          jq -n \
            --arg q "$QUERY" \
            --arg repo "$REPO_SLUG" \
            --arg head "$EXPECTED_HEAD" \
            --arg headline "Release ${NEW_VERSION}" \
            --rawfile body "$NOTES_FILE" \
            --slurpfile additions "$ADD_FILE" \
            --slurpfile deletions "$DEL_FILE" \
            '{
              query: $q,
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: "main" },
                  expectedHeadOid: $head,
                  message: { headline: $headline, body: $body },
                  fileChanges: { additions: $additions[0], deletions: $deletions[0] }
                }
              }
            }' > "$PAYLOAD_FILE"

          RESPONSE=$(gh api graphql --input "$PAYLOAD_FILE")

          SHA=$(jq -r '.data.createCommitOnBranch.commit.oid // empty' <<< "$RESPONSE")
          if [ -z "$SHA" ]; then
            echo "::error::createCommitOnBranch failed:"
            jq . <<< "$RESPONSE"
            exit 1
          fi

          echo "Created signed commit ${SHA} on main"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Add release to job summary
        env:
          NEW_VERSION: ${{ steps.compute.outputs.new-version }}
          SHA: ${{ steps.push.outputs.sha }}
          REPO_SLUG: ${{ inputs.repo_slug }}
        run: |
          {
            echo "## Release \`${NEW_VERSION}\`"
            echo ""
            echo "Squash commit: [\`${SHA:0:7}\`](https://github.com/${REPO_SLUG}/commit/${SHA})"
          } >> "$GITHUB_STEP_SUMMARY"
