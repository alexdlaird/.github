name: Release Pre-req (Squash develop into main)

on:
  workflow_call:
    inputs:
      bump_type:
        description: "patch | minor | major"
        required: true
        type: string
      version_file:
        description: "Path to the file containing the version"
        required: true
        type: string
      version_pattern:
        description: 'sed expression; ${VERSION} will be substituted before invocation'
        required: true
        type: string
      repo_slug:
        description: "owner/repo"
        required: true
        type: string
      validate_command:
        description: "Per-repo validation hook (Makefile target). Runs after squash, before push."
        required: false
        type: string
        default: 'make validate-release VERSION=${VERSION}'
      additional_bump_command:
        description: "Optional shell command run after the primary version_file bump. OLD_VERSION and NEW_VERSION are exposed as env vars. Use for repos that need to bump multiple files (e.g. install-doc pinned versions)."
        required: false
        type: string
        default: ''
      ci_timeout_minutes:
        description: "Max minutes to wait for develop CI to finish before aborting"
        required: false
        type: number
        default: 20
    secrets:
      bot_app_id:
        required: true
      bot_private_key:
        required: true
    outputs:
      version:
        description: "Resolved new version"
        value: ${{ jobs.prereq.outputs.version }}
      squash_commit_sha:
        description: "SHA of new squash commit on main"
        value: ${{ jobs.prereq.outputs.squash_commit_sha }}
      squash_boundary:
        description: "develop SHA squashed (input for cleanup)"
        value: ${{ jobs.prereq.outputs.squash_boundary }}
      release_notes:
        description: "CHANGELOG body for the new version"
        value: ${{ jobs.prereq.outputs.release_notes }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prereq:
    name: Squash develop into main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.new-version }}
      squash_commit_sha: ${{ steps.push.outputs.sha }}
      squash_boundary: ${{ steps.boundary.outputs.sha }}
      release_notes: ${{ steps.compute.outputs.release-notes }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.bot_app_id }}
          private-key: ${{ secrets.bot_private_key }}
          skip-token-revoke: true

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: main

      - name: Get bot user ID
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.bot-user.outputs.user-id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Fetch develop
        run: git fetch origin develop

      - name: Record squash boundary
        id: boundary
        run: echo "sha=$(git rev-parse origin/develop)" >> "$GITHUB_OUTPUT"

      - name: Pre-validate develop ahead of main
        run: |
          AHEAD=$(git rev-list --count main..origin/develop)
          if [ "$AHEAD" -eq 0 ]; then
            echo "::error::develop has no new commits over main — nothing to release."
            exit 1
          fi
          echo "develop is $AHEAD commits ahead of main"

      - name: Squash develop into main
        run: git merge --squash origin/develop

      - name: Compute version + rewrite CHANGELOG
        id: compute
        uses: alexdlaird/.github/actions/prepare-release@main
        with:
          bump-type: ${{ inputs.bump_type }}
          repo-slug: ${{ inputs.repo_slug }}

      - name: Pre-validate tag does not already exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_VERSION: ${{ steps.compute.outputs.new-version }}
          REPO_SLUG: ${{ inputs.repo_slug }}
        run: |
          if gh api "repos/${REPO_SLUG}/git/refs/tags/${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${NEW_VERSION} already exists."
            exit 1
          fi

      - name: Bump version in source file
        env:
          VERSION: ${{ steps.compute.outputs.new-version }}
          VERSION_FILE: ${{ inputs.version_file }}
          VERSION_PATTERN: ${{ inputs.version_pattern }}
        run: |
          PATTERN="${VERSION_PATTERN//\$\{VERSION\}/${VERSION}}"
          sed -i "${PATTERN}" "${VERSION_FILE}"
          grep -F "${VERSION}" "${VERSION_FILE}" >/dev/null \
            || { echo "::error::Version bump failed in ${VERSION_FILE}"; exit 1; }

      - name: Run additional bump command
        if: inputs.additional_bump_command != ''
        env:
          OLD_VERSION: ${{ steps.compute.outputs.old-version }}
          NEW_VERSION: ${{ steps.compute.outputs.new-version }}
          ADDITIONAL_BUMP_COMMAND: ${{ inputs.additional_bump_command }}
        run: |
          eval "${ADDITIONAL_BUMP_COMMAND}"

      - name: Run repo validation
        env:
          VERSION: ${{ steps.compute.outputs.new-version }}
          VALIDATE_COMMAND: ${{ inputs.validate_command }}
        run: |
          eval "${VALIDATE_COMMAND}"

      - name: Wait for build.yml on develop HEAD to succeed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEVELOP_SHA: ${{ steps.boundary.outputs.sha }}
          REPO_SLUG: ${{ inputs.repo_slug }}
          CI_TIMEOUT_MINUTES: ${{ inputs.ci_timeout_minutes }}
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + CI_TIMEOUT_MINUTES * 60 ))
          POLL_INTERVAL=30

          # Guard: develop must not have moved since boundary was recorded
          CURRENT=$(gh api "repos/${REPO_SLUG}/git/refs/heads/develop" --jq .object.sha)
          if [ "$CURRENT" != "$DEVELOP_SHA" ]; then
            echo "::error::develop HEAD moved during release (was ${DEVELOP_SHA}, now ${CURRENT}). Abort and re-dispatch."
            exit 1
          fi

          latest_run() {
            gh api "repos/${REPO_SLUG}/actions/workflows/build.yml/runs?head_sha=${DEVELOP_SHA}" \
              --jq '.workflow_runs | max_by(.id) // empty'
          }

          LATEST=$(latest_run)
          if [ -z "$LATEST" ]; then
            RUN_ID=""; RUN_STATUS=""; RUN_CONCLUSION=""
          else
            RUN_ID=$(jq -r '.id' <<< "$LATEST")
            RUN_STATUS=$(jq -r '.status' <<< "$LATEST")
            RUN_CONCLUSION=$(jq -r '.conclusion // ""' <<< "$LATEST")
          fi

          TRIGGER_FRESH=false
          if [ -z "$RUN_ID" ]; then
            echo "No build.yml run for ${DEVELOP_SHA}; triggering fresh dispatch"
            TRIGGER_FRESH=true
          elif [ "$RUN_STATUS" = "completed" ] && [ "$RUN_CONCLUSION" != "success" ]; then
            echo "Latest build.yml run ${RUN_ID} concluded '${RUN_CONCLUSION}'; triggering fresh dispatch"
            TRIGGER_FRESH=true
          else
            echo "Tracking existing build.yml run ${RUN_ID} (status=${RUN_STATUS})"
          fi

          if [ "$TRIGGER_FRESH" = "true" ]; then
            PRIOR_ID="${RUN_ID:-0}"
            gh workflow run build.yml --ref develop --repo "${REPO_SLUG}"
            for _ in $(seq 1 12); do
              sleep 5
              NEXT=$(latest_run)
              [ -z "$NEXT" ] && continue
              NEXT_ID=$(jq -r '.id' <<< "$NEXT")
              if [ "$NEXT_ID" != "$PRIOR_ID" ]; then
                RUN_ID=$NEXT_ID
                echo "Fresh build.yml run registered: ${RUN_ID}"
                break
              fi
            done
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "$PRIOR_ID" ]; then
              echo "::error::Fresh build.yml dispatch did not register a new run for ${DEVELOP_SHA} within 60s"
              exit 1
            fi
          fi

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RUN=$(gh api "repos/${REPO_SLUG}/actions/runs/${RUN_ID}")
            STATUS=$(jq -r '.status' <<< "$RUN")
            REMAINING=$(( DEADLINE - $(date +%s) ))
            if [ "$STATUS" = "completed" ]; then
              CONCLUSION=$(jq -r '.conclusion // ""' <<< "$RUN")
              if [ "$CONCLUSION" = "success" ]; then
                echo "build.yml run ${RUN_ID} succeeded on develop HEAD"
                exit 0
              fi
              echo "::error::build.yml run ${RUN_ID} concluded '${CONCLUSION}'"
              exit 1
            fi
            echo "build.yml run ${RUN_ID} status=${STATUS} (${REMAINING}s remaining)"
            sleep $POLL_INTERVAL
          done

          echo "::error::Timed out waiting for build.yml run ${RUN_ID} after ${CI_TIMEOUT_MINUTES} minutes"
          exit 1

      - name: Commit + push squash to main
        id: push
        env:
          NEW_VERSION: ${{ steps.compute.outputs.new-version }}
          RELEASE_NOTES: ${{ steps.compute.outputs.release-notes }}
        run: |
          git add -A
          git commit -m "Release ${NEW_VERSION}" -m "${RELEASE_NOTES}"
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
