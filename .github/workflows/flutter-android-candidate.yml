name: Flutter Android Candidate (Build and upload to Play Internal)

# Builds a Flutter app's signed app bundle and uploads it to Google Play's Internal track as a release candidate,
# keeping its version code as the `android-build` artifact; a release later promotes that exact version code. The app
# supplies `make build-aab BUILD=<n>` (signing from SIGNING_* environment variables) and the fastlane lanes
# `next_version_code` and `deploy_internal` (aab_path:, version:).
on:
  workflow_call:
    inputs:
      app_name:
        description: "Short app name; names the Google Play concurrency group"
        required: true
        type: string
      version_file:
        description: "Path to the file containing the version"
        required: false
        type: string
        default: pubspec.yaml
      version_pattern:
        description: 'sed expression that writes the version; ${VERSION} is substituted before invocation'
        required: false
        type: string
        default: 's/^version: .*/version: ${VERSION}/'
      version_parts:
        description: "3 for X.Y.Z; 2 for X.Y (the file holds X.Y.0)"
        required: false
        type: number
        default: 3
      runs_on:
        description: "JSON runner labels (GitHub's Linux, or a self-hosted Mac with Android Studio's SDK)"
        required: false
        type: string
        default: '"ubuntu-latest"'
      dotenv:
        description: "Contents of the app's .env for the build (not secret)"
        required: false
        type: string
        default: 'LOG_LEVEL=INFO'
    secrets:
      google_play_service_account_key:
        required: true
      android_keystore_base64:
        required: true
      android_signing_key_alias:
        required: true
      android_signing_key_password:
        required: true
      android_signing_store_password:
        required: true
      firebase_options_dart:
        description: "Base64 lib/firebase_options.dart, written before building when given"
        required: false
      google_services_json:
        description: "Base64 android/app/google-services.json, written before building when given"
        required: false
    outputs:
      version:
        description: "The version built"
        value: ${{ jobs.build.outputs.version }}
      version_code:
        description: "The Play version code"
        value: ${{ jobs.build.outputs.version_code }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 40
    # One upload to Google Play at a time, never cancelled mid-upload; a newer run waits.
    concurrency:
      group: ${{ inputs.app_name }}-google-play
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.build-number.outputs.number }}

    steps:
      - uses: actions/checkout@v6

      # GitHub's Linux image sets it; a Mac's SDK is Android Studio's.
      - name: Point at the Mac's Android SDK
        if: runner.os == 'macOS'
        run: echo "ANDROID_HOME=${ANDROID_HOME:-$HOME/Library/Android/sdk}" >> "$GITHUB_ENV"

      - name: Read version
        id: version
        uses: alexdlaird/shipshape/read-version@v1
        with:
          version-file: ${{ inputs.version_file }}
          version-pattern: ${{ inputs.version_pattern }}
          version-parts: ${{ inputs.version_parts }}

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: android/*.gradle*

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Write Firebase config
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.firebase_options_dart }}
          GOOGLE_SERVICES_JSON: ${{ secrets.google_services_json }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo -n "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo -n "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Write build environment
        env:
          DOTENV: ${{ inputs.dotenv }}
        run: printf '%s\n' "$DOTENV" > .env

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: 'Gemfile.lock'
          bundler-cache: true
          working-directory: android

      - name: Install Fastlane
        run: cd android && bundle install

      - name: Write Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.google_play_service_account_key }}
        run: echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" > android/service-account-key.json

      # The version code comes from Play (the highest on any track, plus one), so builds stay in order however they're
      # started.
      - name: Compute version code
        id: build-number
        run: |
          CODE=$(cd android && bundle exec fastlane next_version_code 2>&1 \
            | sed -n 's/.*Next version code: \([0-9]*\)/\1/p' | tail -1)
          if [ -z "$CODE" ]; then
            echo "::error::Could not read the next version code from Google Play"
            exit 1
          fi
          echo "number=$CODE" >> "$GITHUB_OUTPUT"
          echo "Build: ${{ steps.version.outputs.version }}+${CODE}"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.android_keystore_base64 }}
        run: echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"

      - name: Build app bundle
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.android_signing_key_alias }}
          SIGNING_KEY_PASSWORD: ${{ secrets.android_signing_key_password }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload-key.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.android_signing_store_password }}
        run: make build-aab BUILD=${{ steps.build-number.outputs.number }}

      - name: Deploy to Google Play Internal track
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd android
          bundle exec fastlane deploy_internal \
            aab_path:../build/app/outputs/bundle/release/app-release.aab \
            version:"$VERSION"

      # A release promotes this exact version code to Production, read from this artifact.
      - name: Keep the version code for release
        run: |
          mkdir -p build/release-candidate
          echo "${{ steps.build-number.outputs.number }}" > build/release-candidate/version_code.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: build/release-candidate/version_code.txt
          retention-days: 90

      - name: Cleanup
        if: always()
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.firebase_options_dart }}
          GOOGLE_SERVICES_JSON: ${{ secrets.google_services_json }}
        run: |
          rm -f .env android/service-account-key.json "$RUNNER_TEMP/upload-key.jks"
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then rm -f lib/firebase_options.dart; fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then rm -f android/app/google-services.json; fi

      - name: Deployment summary
        run: |
          {
            echo "### Android Deployment Complete"
            echo ""
            echo "- **Build**: \`${{ steps.version.outputs.version }}+${{ steps.build-number.outputs.number }}\`"
            echo "- **Destination**: Google Play Internal track"
          } >> "$GITHUB_STEP_SUMMARY"
